name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q launcher scripts tests
      - run: git diff --check

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: compatibility
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads(
              Path("BUNDLE_COMPATIBILITY.json").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"repository={record['bundle_repository']}\n")
              output.write(f"ref={record['bundle_ref']}\n")
              output.write(f"commit={record['bundle_commit']}\n")
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.compatibility.outputs.repository }}
          ref: ${{ steps.compatibility.outputs.ref }}
          path: brightspace-rubric-bundle
      - name: Verify exact bundle commit
        shell: bash
        run: |
          test "$(git -C brightspace-rubric-bundle rev-parse HEAD)" = \
            "${{ steps.compatibility.outputs.commit }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Build portable and managed packages twice
        shell: bash
        run: |
          python scripts/make_release_bundle.py \
            --runner-ref HEAD \
            --bundle-ref HEAD \
            --bundle-dir brightspace-rubric-bundle \
            --output-dir dist/one
          python scripts/make_managed_install_bundle.py \
            --runner-ref HEAD \
            --bundle-ref HEAD \
            --bundle-dir brightspace-rubric-bundle \
            --output-dir dist/one
          python scripts/make_release_bundle.py \
            --runner-ref HEAD \
            --bundle-ref HEAD \
            --bundle-dir brightspace-rubric-bundle \
            --output-dir dist/two
          python scripts/make_managed_install_bundle.py \
            --runner-ref HEAD \
            --bundle-ref HEAD \
            --bundle-dir brightspace-rubric-bundle \
            --output-dir dist/two
          cmp dist/one/rubric-loom-v1.0.0.zip \
            dist/two/rubric-loom-v1.0.0.zip
          cmp dist/one/rubric-loom-managed-v1.0.0.zip \
            dist/two/rubric-loom-managed-v1.0.0.zip
          (cd dist/one && sha256sum -c rubric-loom-v1.0.0.zip.sha256)
          (cd dist/one && \
            sha256sum -c rubric-loom-managed-v1.0.0.zip.sha256)
      - name: Inspect and health-check managed package
        shell: bash
        run: |
          mkdir extracted
          unzip -q dist/one/rubric-loom-managed-v1.0.0.zip -d extracted
          root="extracted/rubric-loom-managed-v1.0.0"
          python "$root/launcher/stable_launcher.py" \
            --install-root "$root" \
            --health
