name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate annotated tag and release identity
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - id: compatibility
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads(
              Path("BUNDLE_COMPATIBILITY.json").read_text(encoding="utf-8")
          )
          if record["status"] != "released":
              raise SystemExit("bundle compatibility lock is not released")
          if record["runner_version"] != Path("VERSION").read_text().strip():
              raise SystemExit("runner version does not match compatibility lock")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"repository={record['bundle_repository']}\n")
              output.write(f"ref={record['bundle_ref']}\n")
              output.write(f"commit={record['bundle_commit']}\n")
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.compatibility.outputs.repository }}
          ref: ${{ steps.compatibility.outputs.ref }}
          path: brightspace-rubric-bundle
      - name: Verify exact bundle commit
        shell: bash
        run: |
          test "$(git -C brightspace-rubric-bundle rev-parse HEAD)" = \
            "${{ steps.compatibility.outputs.commit }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Build release assets
        shell: bash
        run: |
          python scripts/make_release_bundle.py \
            --runner-ref "$GITHUB_REF_NAME" \
            --bundle-ref HEAD \
            --bundle-dir brightspace-rubric-bundle
          python scripts/make_managed_install_bundle.py \
            --runner-ref "$GITHUB_REF_NAME" \
            --bundle-ref HEAD \
            --bundle-dir brightspace-rubric-bundle
          cd dist
          sha256sum -c rubric-loom-v*.zip.sha256
          sha256sum -c rubric-loom-managed-v*.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: rubric-loom-release-assets
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rubric Loom $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --verify-tag
